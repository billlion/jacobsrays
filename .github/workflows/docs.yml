name: Documentation
on:
  pull_request:
    paths:
      - 'docs/paper/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/paper/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package for complete documentation examples
        run: python -m pip install '.[scipy]'
      - name: Run complete Python listings
        run: make -C docs/paper snippets
      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Build PDF and resolve references
        run: make -B -C docs/paper
      - uses: actions/upload-artifact@v4
        with:
          name: jacobsrays-user-guide
          path: docs/paper/jacobsrays.pdf

name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[scipy]'
      - run: python -m unittest discover -s tests -v
      - run: python examples/tensor_lrt.py
      - run: python examples/nonabelian_transport.py
      - run: cmake -S . -B build/core
      - run: cmake --build build/core --config Release
      - run: ctest --test-dir build/core -C Release --output-on-failure
  openmp:
    runs-on: ubuntu-latest
    env:
      JACOBSRAYS_OPENMP: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[scipy]'
      - run: python -m unittest discover -s tests -v
  cil:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Explicitly pinned to the upstream source used for local validation.
      # ASTRA's CPU line projectors provide an independent reference; no GPU needed.
      - run: python -m pip install '.[scipy]' 'astra-toolbox==2.5.0' 'cil @ git+https://github.com/TomographicImaging/CIL.git@b39f95799bf1af891a896fc4be704986284b593e'
      - run: python -c "import astra; import cil; print('ASTRA', astra.__version__)"
      - run: python -m unittest discover -s tests -v
      - run: python examples/cil_cgls.py
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Public-repository MATLAB licensing is supplied by the MathWorks actions.
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('matlab'); mex('-setup','C++'); build_jacobsrays; test_jacobsrays

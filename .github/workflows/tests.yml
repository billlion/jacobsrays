name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[scipy]'
      - run: python -m unittest discover -s tests -v
      - run: python examples/tensor_lrt.py
      - run: python examples/nonabelian_transport.py
      - run: cmake -S . -B build/core
      - run: cmake --build build/core --config Release
      - run: ctest --test-dir build/core -C Release --output-on-failure
  openmp:
    runs-on: ubuntu-latest
    env:
      JACOBSRAYS_OPENMP: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[scipy]'
      - run: python -m unittest discover -s tests -v
  cil:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Explicitly pinned to the upstream source used for local validation.
      - run: python -m pip install '.[scipy]' 'cil @ git+https://github.com/TomographicImaging/CIL.git@b39f95799bf1af891a896fc4be704986284b593e'
      - run: python -m unittest discover -s tests -v
      - run: python examples/cil_cgls.py
